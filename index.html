<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة سلة المشتريات - الواحة</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fdfbf7;
            margin: 0; padding: 0; color: #333;
            padding-bottom: 80px; /* مساحة للسلة العايمة */
        }
        .header {
            background-color: #a81c1c; color: #fff;
            text-align: center; padding: 15px;
        }
        .header h1 { margin: 0; font-size: 24px; }
        
        .container { padding: 15px; max-width: 600px; margin: auto; }
        
        .category {
            background: #fff; border-radius: 12px; padding: 15px;
            margin-bottom: 20px; border: 1px solid #eee;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .category-title {
            color: #a81c1c; border-bottom: 2px solid #f4f4f4;
            padding-bottom: 10px; margin-top: 0; text-align: center;
        }
        
        .item {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px dashed #e0e0e0; padding: 10px 0;
        }
        .item:last-child { border-bottom: none; }
        
        .item-info { flex: 1; }
        .item-name { font-weight: bold; display: block; font-size: 15px; }
        .item-price { color: #27ae60; font-weight: bold; font-size: 13px; }
        
        /* أزرار الإضافة للسلة */
        .quantity-control {
            display: flex; align-items: center; gap: 10px;
        }
        .quantity-control button {
            background-color: #a81c1c; color: white; border: none;
            width: 30px; height: 30px; border-radius: 5px;
            font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .quantity-control span {
            font-weight: bold; font-size: 16px; width: 20px; text-align: center;
        }

        /* السلة العائمة أسفل الشاشة */
        .floating-cart {
            position: fixed; bottom: 0; left: 0; right: 0;
            background-color: #27ae60; color: white;
            padding: 15px 20px; display: flex; justify-content: space-between;
            align-items: center; box-shadow: 0 -4px 10px rgba(0,0,0,0.2);
            cursor: pointer; z-index: 1000;
        }
        .floating-cart h3 { margin: 0; font-size: 18px; }
        .floating-cart span { font-weight: bold; font-size: 18px; }

        /* نافذة تأكيد الطلب (Modal) */
        .cart-modal {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); z-index: 2000;
            justify-content: center; align-items: center; padding: 20px;
        }
        .cart-content {
            background: #fff; width: 100%; max-width: 400px;
            border-radius: 15px; padding: 20px; max-height: 80vh; overflow-y: auto;
        }
        .cart-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 15px;
        }
        .cart-header h2 { margin: 0; color: #a81c1c; }
        .close-btn {
            background: none; border: none; font-size: 24px; color: #777; cursor: pointer;
        }
        .cart-items-list { margin-bottom: 15px; }
        .cart-item-row {
            display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 15px;
        }
        .total-row {
            display: flex; justify-content: space-between; font-weight: bold;
            font-size: 18px; color: #27ae60; border-top: 2px solid #eee; padding-top: 10px;
        }
        .table-input {
            width: 100%; padding: 10px; margin: 15px 0; border: 1px solid #ccc;
            border-radius: 8px; font-family: 'Cairo'; font-size: 15px; box-sizing: border-box;
        }
        .send-whatsapp-btn {
            background-color: #25D366; color: white; border: none; width: 100%;
            padding: 12px; border-radius: 8px; font-weight: bold; font-size: 18px;
            cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>فول وفلافل الواحة</h1>
    </div>

    <div class="container">
        
        <!-- قسم الفول -->
        <div class="category">
            <h2 class="category-title">سندوتشات الفول</h2>
            
            <div class="item" data-id="1" data-name="فول الواحة" data-price="15">
                <div class="item-info">
                    <span class="item-name">فول الواحة</span>
                    <span class="item-price">15 ج</span>
                </div>
                <div class="quantity-control">
                    <button onclick="updateQty(1, 1)">+</button>
                    <span id="qty-1">0</span>
                    <button onclick="updateQty(1, -1)">-</button>
                </div>
            </div>

            <div class="item" data-id="2" data-name="فول اسكندراني" data-price="16">
                <div class="item-info">
                    <span class="item-name">فول اسكندراني</span>
                    <span class="item-price">16 ج</span>
                </div>
                <div class="quantity-control">
                    <button onclick="updateQty(2, 1)">+</button>
                    <span id="qty-2">0</span>
                    <button onclick="updateQty(2, -1)">-</button>
                </div>
            </div>
            
        </div>

        <!-- قسم الطعمية -->
        <div class="category">
            <h2 class="category-title">سندوتشات الطعمية</h2>
            
            <div class="item" data-id="3" data-name="طعمية عادي" data-price="15">
                <div class="item-info">
                    <span class="item-name">طعمية عادي</span>
                    <span class="item-price">15 ج</span>
                </div>
                <div class="quantity-control">
                    <button onclick="updateQty(3, 1)">+</button>
                    <span id="qty-3">0</span>
                    <button onclick="updateQty(3, -1)">-</button>
                </div>
            </div>

            <div class="item" data-id="4" data-name="طعمية محشية" data-price="18">
                <div class="item-info">
                    <span class="item-name">طعمية محشية</span>
                    <span class="item-price">18 ج</span>
                </div>
                <div class="quantity-control">
                    <button onclick="updateQty(4, 1)">+</button>
                    <span id="qty-4">0</span>
                    <button onclick="updateQty(4, -1)">-</button>
                </div>
            </div>

        </div>

    </div>

    <!-- السلة العائمة -->
    <div class="floating-cart" id="floatingCart" onclick="openCart()" style="display: none;">
        <h3>السلة (<span id="cartCount">0</span>)</h3>
        <span>الإجمالي: <span id="cartTotal">0</span> ج</span>
    </div>

    <!-- نافذة تأكيد الطلب -->
    <div class="cart-modal" id="cartModal">
        <div class="cart-content">
            <div class="cart-header">
                <h2>مراجعة الطلب</h2>
                <button class="close-btn" onclick="closeCart()">×</button>
            </div>
            <div class="cart-items-list" id="cartItemsList">
                <!-- المنتجات هتنزل هنا بالبرمجة -->
            </div>
            <div class="total-row">
                <span>الإجمالي الكلي:</span>
                <span id="modalTotal">0 ج</span>
            </div>
            <input type="text" id="tableNumber" class="table-input" placeholder="رقم الترابيزة (أو العنوان)">
            <button class="send-whatsapp-btn" onclick="sendOrder()">
                إرسال الطلب عبر واتساب 💬
            </button>
        </div>
    </div>

    <!-- برمجة الجافاسكريبت للتحكم في الطلبات والواتساب -->
    <script>
        // مصفوفة لتخزين الطلبات
        let cart = {}; 

        // دالة تزويد وتنقيس الكمية
        function updateQty(id, change) {
            let itemElement = document.querySelector(`.item[data-id="${id}"]`);
            let name = itemElement.getAttribute('data-name');
            let price = parseInt(itemElement.getAttribute('data-price'));
            
            if (!cart[id]) {
                cart[id] = { name: name, price: price, qty: 0 };
            }
            
            cart[id].qty += change;
            
            if (cart[id].qty <= 0) {
                cart[id].qty = 0;
                delete cart[id];
            }
            
            document.getElementById(`qty-${id}`).innerText = cart[id] ? cart[id].qty : 0;
            updateCartUI();
        }

        // دالة تحديث شكل السلة والإجمالي
        function updateCartUI() {
            let totalQty = 0;
            let totalPrice = 0;
            
            for (let id in cart) {
                totalQty += cart[id].qty;
                totalPrice += cart[id].qty * cart[id].price;
            }
            
            document.getElementById('cartCount').innerText = totalQty;
            document.getElementById('cartTotal').innerText = totalPrice;
            
            let floatingCart = document.getElementById('floatingCart');
            if (totalQty > 0) {
                floatingCart.style.display = 'flex';
            } else {
                floatingCart.style.display = 'none';
                closeCart();
            }
        }

        // فتح وإغلاق نافذة السلة
        function openCart() {
            let cartItemsList = document.getElementById('cartItemsList');
            cartItemsList.innerHTML = '';
            let totalPrice = 0;

            for (let id in cart) {
                let itemTotal = cart[id].qty * cart[id].price;
                totalPrice += itemTotal;
                
                cartItemsList.innerHTML += `
                    <div class="cart-item-row">
                        <span>${cart[id].qty}x ${cart[id].name}</span>
                        <span>${itemTotal} ج</span>
                    </div>
                `;
            }
            
            document.getElementById('modalTotal').innerText = totalPrice + ' ج';
            document.getElementById('cartModal').style.display = 'flex';
        }

        function closeCart() {
            document.getElementById('cartModal').style.display = 'none';
        }

        // دالة إرسال الطلب على واتساب
        function sendOrder() {
            let tableNum = document.getElementById('tableNumber').value;
            if (tableNum.trim() === '') {
                alert('عشان ناكد الطلب، ياريت تكتب رقم الترابيزة أو العنوان!');
                return;
            }

            let message = "*طلب جديد من المنيو الديجيتال 🔴* \n\n";
            let totalPrice = 0;

            for (let id in cart) {
                let itemTotal = cart[id].qty * cart[id].price;
                totalPrice += itemTotal;
                message += `- ${cart[id].qty}x ${cart[id].name} (${itemTotal} ج)\n`;
            }

            message += `\n*الإجمالي:* ${totalPrice} ج\n`;
            message += `*التفاصيل / رقم الترابيزة:* ${tableNum}\n`;

            // رقم واتساب المطعم (بدون أصفار في البداية ومع كود الدولة)
            let phone = "201013606635"; 
            
            // تحويل النص لصيغة تقبلها الروابط
            let encodedMessage = encodeURIComponent(message);
            
            // فتح الواتساب
            window.open(`https://wa.me/${phone}?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
