<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو المطعم</title>
    <style>
        /* التصميم: أحمر وأبيض */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffffff; /* خلفية بيضاء */
            margin: 0;
            padding: 0;
            color: #333;
        }
        header {
            background-color: #d32f2f; /* لون أحمر */
            color: white;
            text-align: center;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .menu-item {
            background: #fff;
            border: 2px solid #d32f2f; /* إطار أحمر */
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 4px rgba(211, 47, 47, 0.1);
        }
        .item-info h3 {
            margin: 0 0 5px 0;
            color: #d32f2f;
        }
        .item-info p {
            margin: 0;
            color: #555;
            font-size: 14px;
        }
        .item-info strong {
            display: inline-block;
            margin-top: 5px;
            color: #b71c1c;
        }
        button {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        button:hover {
            background-color: #b71c1c;
        }
        .cart-section {
            background: #fff;
            padding: 20px;
            border: 2px solid #d32f2f;
            border-radius: 8px;
            margin-top: 30px;
            box-shadow: 0 4px 8px rgba(211, 47, 47, 0.1);
        }
        .cart-section h2 {
            margin-top: 0;
            color: #d32f2f;
            border-bottom: 2px solid #ffebee;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #d32f2f;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ffcdd2;
            border-radius: 5px;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #d32f2f;
        }
        .cart-items-list {
            margin-bottom: 20px;
        }
        .cart-item-row {
            display: flex;
            justify-content: space-between;
            border-bottom: 1px dashed #ffcdd2;
            padding: 8px 0;
        }
        .total-row {
            font-size: 18px;
            font-weight: bold;
            color: #d32f2f;
            text-align: left;
            margin-top: 15px;
            background-color: #ffebee;
            padding: 10px;
            border-radius: 5px;
        }
        .checkout-btn {
            width: 100%;
            background-color: #25D366; /* لون الواتساب الأخضر عشان يكون واضح */
            font-size: 16px;
            padding: 15px;
            margin-top: 15px;
            color: white;
        }
        .checkout-btn:hover {
            background-color: #128C7E;
        }
    </style>
</head>
<body>

    <header>
        <h1>مطعم الواحة</h1>
        <p>أشهى المأكولات - اطلب الآن</p>
    </header>

    <div class="container">
        <!-- قسم المنيو -->
        <div id="menu-container">
            <div class="menu-item">
                <div class="item-info">
                    <h3>فول الواحة</h3>
                    <p>عيش بلدي</p>
                    <strong>15 ج.م</strong>
                </div>
                <button onclick="addToCart('فول الواحة', 'عيش بلدي', 15)">إضافة للسلة</button>
            </div>

            <div class="menu-item">
                <div class="item-info">
                    <h3>فول الواحة</h3>
                    <p>عيش شامي</p>
                    <strong>15 ج.م</strong>
                </div>
                <button onclick="addToCart('فول الواحة', 'عيش شامي', 15)">إضافة للسلة</button>
            </div>

            <div class="menu-item">
                <div class="item-info">
                    <h3>فول ع باذنجان</h3>
                    <p>عيش بلدي</p>
                    <strong>18 ج.م</strong>
                </div>
                <button onclick="addToCart('فول ع باذنجان', 'عيش بلدي', 18)">إضافة للسلة</button>
            </div>
        </div>

        <!-- قسم سلة المشتريات -->
        <div class="cart-section">
            <h2>🛒 سلة المشتريات</h2>
            <div id="cart-items-container" class="cart-items-list">
                <p style="color: #999;">السلة فارغة حالياً...</p>
            </div>

            <hr style="border: 1px solid #ffebee; margin: 20px 0;">

            <h2>📋 بيانات الطلب</h2>
            
            <div class="form-group">
                <label>الاسم:</label>
                <input type="text" id="cust-name" placeholder="اكتب اسمك هنا...">
            </div>
            
            <div class="form-group">
                <label>رقم الموبايل:</label>
                <input type="tel" id="cust-phone" placeholder="مثال: 01xxxxxxxxx">
            </div>

            <!-- خانة المنطقة (بتحدد سعر التوصيل) -->
            <div class="form-group">
                <label>المنطقة (العنوان):</label>
                <select id="cust-area" onchange="updateCartUI()">
                    <option value="غير محدد" data-fee="0" disabled selected>اختر المنطقة...</option>
                    <option value="المنطقة الأولى" data-fee="10">المنطقة الأولى (توصيل 10 ج.م)</option>
                    <option value="المنطقة الثانية" data-fee="15">المنطقة الثانية (توصيل 15 ج.م)</option>
                    <option value="المنطقة الثالثة" data-fee="20">المنطقة الثالثة (توصيل 20 ج.م)</option>
                </select>
            </div>

            <!-- خانة العنوان تفصيلاً -->
            <div class="form-group">
                <label>العنوان تفصيلاً:</label>
                <input type="text" id="cust-address-details" placeholder="الشارع، رقم العمارة، الدور، الشقة...">
            </div>
            
            <button class="checkout-btn" onclick="checkout()">✅ إرسال الطلب عبر واتساب</button>
        </div>
    </div>

    <script>
        let cart = [];

        function addToCart(name, details, price) {
            let existingItem = cart.find(item => item.name === name && item.details === details);
            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({ name: name, details: details, price: price, quantity: 1 });
            }
            updateCartUI();
        }

        function updateCartUI() {
            let cartContainer = document.getElementById('cart-items-container');
            if (cart.length === 0) {
                cartContainer.innerHTML = '<p style="color: #999;">السلة فارغة حالياً...</p>';
                return;
            }

            cartContainer.innerHTML = '';
            let itemsTotal = 0;
            
            cart.forEach(item => {
                itemsTotal += (item.price * item.quantity);
                cartContainer.innerHTML += `
                    <div class="cart-item-row">
                        <span>${item.quantity}x ${item.name} [${item.details}]</span>
                        <span>${item.price * item.quantity} ج.م</span>
                    </div>
                `;
            });

            // حساب خدمة التوصيل
            let areaSelect = document.getElementById('cust-area');
            let deliveryFee = parseInt(areaSelect.options[areaSelect.selectedIndex].getAttribute('data-fee')) || 0;
            
            let finalTotal = itemsTotal + deliveryFee;

            if(deliveryFee > 0) {
                cartContainer.innerHTML += `
                    <div class="cart-item-row" style="color: #d32f2f;">
                        <span>خدمة التوصيل</span>
                        <span>${deliveryFee} ج.م</span>
                    </div>
                `;
            }
            
            cartContainer.innerHTML += `
                <div class="total-row">
                    الإجمالي المطلوب: ${finalTotal} ج.م
                </div>
            `;
        }

        function checkout() {
            if (cart.length === 0) {
                alert("السلة فارغة! برجاء اختيار بعض الأصناف أولاً.");
                return;
            }

            let name = document.getElementById('cust-name').value || "غير محدد";
            let phone = document.getElementById('cust-phone').value || "غير محدد";
            let areaSelect = document.getElementById('cust-area');
            let areaName = areaSelect.options[areaSelect.selectedIndex].value;
            let addressDetails = document.getElementById('cust-address-details').value || "غير محدد";
            
            if (areaName === "غير محدد") {
                alert("برجاء اختيار المنطقة أولاً لحساب خدمة التوصيل.");
                return;
            }

            let orderId = "WA-" + Math.floor(Math.random() * 9000 + 1000);
            let gpsLink = "https://maps.google.com/"; 

            let itemsList = cart.map(item => 
                `🔸 ${item.quantity} « ${item.name} [${item.details}]`
            ).join('\n');

            let whatsappMessage = `👤 العميل: ${name}
📱 الموبايل: ${phone}
🛵 نوع الطلب: دليفري
📍 المنطقة: ${areaName}
🏠 العنوان تفصيلاً: ${addressDetails}
🏞️ اللوكيشن (GPS): ${gpsLink}
────────────────
📋 جدول الطلبات:
────────────────
${itemsList}
────────────────
✅ رقم الطلب للمتابعة: ${orderId}`;

            let encodedMessage = encodeURIComponent(whatsappMessage);
            let restaurantWhatsAppNumber = "201000000000"; // حط رقم المطعم هنا
            let whatsappUrl = `https://wa.me/${restaurantWhatsAppNumber}?text=${encodedMessage}`;
            
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
