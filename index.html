        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.4s ease-out; }

        .section-title { margin: 20px 15px 15px; font-size: 22px; color: var(--dark-red); font-weight: 900; display: flex; align-items: center; gap: 10px; }

        .menu-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 15px; }

        .menu-card { background: var(--white); border-radius: 12px; border: 1px solid #f0f0f0; box-shadow: 0 2px 5px rgba(0,0,0,0.02); padding: 15px; display: flex; flex-direction: column; justify-content: space-between; }

        .add-btn:active { transform: scale(0.9); }

        .bread-chips { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;}
        .bread-chips input { display: none; }
        .bread-chips label { flex: 1; text-align: center; background: var(--light-bg); border: 2px solid #eee; padding: 8px; border-radius: 10px; cursor: pointer; font-weight: bold; color: var(--text-dark); transition: 0.2s; min-width: 30%; }
        .bread-chips input:checked + label { background: var(--main-red); color: var(--white); border-color: var(--main-red); }

        .modal-qty-container { display: flex; justify-content: space-between; align-items: center; background: #f1f2f6; padding: 10px 15px; border-radius: 12px; margin-bottom: 15px; }
        .modal-qty-title { font-weight: bold; color: var(--text-dark); font-size: 16px; margin: 0; }
        .modal-qty-controls { display: flex; align-items: center; gap: 15px; }
        .modal-qty-btn { background-color: var(--white); border: 1px solid #ddd; width: 35px; height: 35px; border-radius: 8px; font-size: 20px; font-weight: bold; cursor: pointer; color: var(--text-dark); display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .modal-qty-display { font-size: 18px; font-weight: 900; color: var(--main-red); width: 20px; text-align: center;}
        
        .confirm-add-btn { width: 100%; background-color: var(--main-red); color: var(--white); border: none; padding: 15px; border-radius: 10px; font-size: 18px; font-weight: bold; margin-top: 5px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; font-family: inherit; box-shadow: 0 4px 10px rgba(211,47,47,0.3); }

        .cart-count { background-color: var(--white); color: var(--dark-red); border-radius: 50%; width: 24px; height: 24px; display: flex; justify-content: center; align-items: center; font-size: 13px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); z-index: 2000; align-items: flex-end; }
        .modal-content { background-color: var(--white); width: 100%; border-radius: 20px 20px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        .cart-item-price { color: var(--main-red); font-size: 14px; font-weight: bold;}

                    { name: "علبة بورية", price: 25, sizes: { "صغير": 25, "كبير": 35 } },
                    { name: "علبة باذنجان", price: 10, sizes: { "صغير": 10, "كبير": 15 } },
                    { name: "علبة شكشوكة", price: 25, sizes: { "صغير": 25, "كبير": 35 } },

                    { name: "باكيت شيبسي", price: 20, sizes: { "صغير": 20, "وسط": 25, "كبير": 30 } },
                    { name: "طبق بسطرمة", price: 35, sizes: { "صغير": 35, "كبير": 40 } },

                    { name: "طبق أومليت رومي", price: 35, sizes: { "صغير": 35, "كبير": 40 } },
                    { name: "طبق أومليت خضار", price: 30, sizes: { "صغير": 30, "كبير": 40 } },
                    { name: "طبق بيتزا", price: 35, sizes: { "صغير": 35, "كبير": 40 } },
                    { name: "علبة فول بالصلصة", price: 30, sizes: { "صغير": 30, "كبير": 35 } },
                    { name: "باكيت بطاطس صوابع", price: 25, sizes: { "صغير": 25, "وسط": 30, "كبير": 40 } },
                    { name: "باكيت بطاطس جمبري", price: 25, sizes: { "صغير": 25, "وسط": 30, "كبير": 40 } }
                ]
            },
            {
                id: "salads", title: "ركن السلطات والمخللات",
                items: [
                    { name: "سلطة بلدي", price: 15 }, { name: "سلطة طحينة", price: 25 },
                    { name: "طبق باذنجان مخلل مقلي", price: 25 }, { name: "طحينة", price: 15 },
                    { name: "بابا غنوج", price: 25 }, { name: "خيار مخلل / طبق بصل / ليمون", price: 15 },
                    { name: "طرشي", price: 15 }, { name: "طبق باذنجان", price: 15 },
                    { name: "طبق طرنشات", price: 15 }, { name: "رغيف عيش", price: 3.5 },
                    { name: "رغيف عيش شامي", price: 2 }
                ]
            },
            {
                id: "drinks", title: "ركن المشروبات",
                items: [
                    { name: "كانز كبيرة", price: 20 }, { name: "مياة معدنية", price: 10 }
                ]
            }
        ];

        function initMenu() {
            const navContainer = document.getElementById('nav-container');
            let navHtml = '';
            menuData.forEach((sec, index) => {
                navHtml += `<button class="category-link ${index === 0 ? 'active' : ''}" onclick="selectCategory('${sec.id}', this)">${sec.title}</button>`;
            });
            navContainer.innerHTML = navHtml;
            if(menuData.length > 0) renderCategory(menuData[0].id);
        }

        function selectCategory(id, btnElement) {
            document.querySelectorAll('.category-link').forEach(btn => btn.classList.remove('active'));
            if(btnElement) btnElement.classList.add('active');
            renderCategory(id);
        }

        function renderCategory(categoryId) {
            const section = menuData.find(s => s.id === categoryId);
            const container = document.getElementById('menu-container');
            
            let itemsHtml = section.items.map(item => {
                let displayPrice = item.price;
                if(item.sizes) { 
                    const prices = Object.values(item.sizes);
                    displayPrice = prices.join(' / '); 
                }
                
                return `
                <div class="menu-card fade-in">
                    <h3 class="card-title">${item.name}</h3>
                    <div class="price-action">
                        <span class="price" style="font-size: 15px;">${displayPrice} ج.م</span>
                        <button class="add-btn" onclick="openOptions('${item.name}', '${section.id}')">+</button>
                    </div>
                </div>
                `;
            }).join('');

            container.innerHTML = `
                <section id="${section.id}">
                    <h2 class="section-title fade-in">${section.title}</h2>
                    <div class="menu-grid">
                        ${itemsHtml}
                    </div>
                </section>
            `;
        }

        function openOptions(name, categoryId) {
            const section = menuData.find(s => s.id === categoryId);
            const item = section.items.find(i => i.name === name);

            selectedItemForAdd = { name: item.name, price: item.price };
            currentModalQty = 1; 
            
            document.getElementById('opt-title').innerText = item.name;
            document.getElementById('modal-qty-display').innerText = currentModalQty;

            if (categoriesWithBread.includes(categoryId)) {
                document.getElementById('bread-section').style.display = 'block';
            } else {
                document.getElementById('bread-section').style.display = 'none';
            }

            if (item.sizes) {
                document.getElementById('size-section').style.display = 'block';
                let sizeHtml = '';
                let isFirst = true;
                for (const [sizeName, sizePrice] of Object.entries(item.sizes)) {
                    let checked = isFirst ? 'checked' : '';
                    sizeHtml += `
                        <input type="radio" name="size" id="s-${sizeName}" value="${sizeName}" onchange="updateSizePrice(${sizePrice})" ${checked}>
                        <label for="s-${sizeName}">${sizeName}</label>
                    `;
                    if(isFirst) {
                        selectedItemForAdd.price = sizePrice; 
                        isFirst = false;
                    }
                }
                document.getElementById('dynamic-sizes').innerHTML = sizeHtml;
            } else {
                document.getElementById('size-section').style.display = 'none';
            }

            updateModalPriceDisplay();
            document.getElementById('options-modal').style.display = 'flex';
        }

        function closeOptions() { document.getElementById('options-modal').style.display = 'none'; }

        function updateSizePrice(newPrice) {
            selectedItemForAdd.price = newPrice;
            updateModalPriceDisplay();
        }

        function changeModalQty(change) {
            if (currentModalQty + change >= 1) {
                currentModalQty += change;
                document.getElementById('modal-qty-display').innerText = currentModalQty;
                updateModalPriceDisplay();
            }
        }

        function updateModalPriceDisplay() {
            let total = selectedItemForAdd.price * currentModalQty;
            document.getElementById('opt-price').innerText = total;
        }

        function confirmAdd() {
            let finalName = selectedItemForAdd.name;
            const finalPrice = selectedItemForAdd.price;

            if (document.getElementById('bread-section').style.display === 'block') {
                const selectedBread = document.querySelector('input[name="bread"]:checked').value;
                finalName += ` [عيش ${selectedBread}]`;
            }

            if (document.getElementById('size-section').style.display === 'block') {
                const selectedSize = document.querySelector('input[name="size"]:checked').value;
                finalName += ` [حجم ${selectedSize}]`;
            }

            let existingItem = cart.find(item => item.name === finalName && item.price === finalPrice);
            if (existingItem) {
                existingItem.qty += currentModalQty; 
            } else {
                cart.push({ name: finalName, price: finalPrice, qty: currentModalQty });
            }
            
            updateCartUI();
            closeOptions();
            
            const cartBtn = document.querySelector('.floating-cart');
            cartBtn.style.transform = 'translateX(-50%) scale(1.1)';
            setTimeout(() => { cartBtn.style.transform = 'translateX(-50%) scale(1)'; }, 200);
        }

        function toggleDeliveryFields() {
            const orderType = document.getElementById('cust-order-type').value;
            const deliveryFields = document.getElementById('delivery-fields');
            const deliveryFeeDisplay = document.getElementById('delivery-fee-display');
            
            if (orderType === 'دليفري') {
                deliveryFields.style.display = 'block';
                deliveryFeeDisplay.style.display = 'flex';
            } else {
                deliveryFields.style.display = 'none';
                deliveryFeeDisplay.style.display = 'none';
            }
            updateCartUI();
        }

        function updateCartUI() {
            let totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-counter').innerText = totalQty;

            let container = document.getElementById('cart-items-container');
            container.innerHTML = '';
            let subTotal = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.qty;
                subTotal += itemTotal;
                container.innerHTML += `
                    <div class="cart-item">
                        <div style="flex-grow:1">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-price">${item.price} ج.م</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty(${index}, 1)">+</button>
                            <span style="font-weight:bold">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${index}, -1)">-</button>
                        </div>
                    </div>
                `;
            });

            let deliveryFee = 0;
            const orderType = document.getElementById('cust-order-type').value;
            if(orderType === 'دليفري') {
                const areaSelect = document.getElementById('cust-area');
                if (areaSelect.value !== "0") {
                    deliveryFee = parseInt(areaSelect.value);
                }
            }

            document.getElementById('delivery-price').innerText = deliveryFee;
            document.getElementById('total-price').innerText = subTotal + deliveryFee;
        }

        function changeQty(index, change) {
            cart[index].qty += change;
            if (cart[index].qty <= 0) cart.splice(index, 1);
            updateCartUI();
        }

        function openCart() {
            if(cart.length === 0) { alert("السلة فاضية يا فندم، اختار طلبك الأول!"); return; }
            document.getElementById('cart-modal').style.display = 'flex';
        }

        function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

        function sendWhatsAppOrder() {
            if (cart.length === 0) return;

            let name = document.getElementById('cust-name').value.trim();
            let phone = document.getElementById('cust-phone').value.trim();
            let orderType = document.getElementById('cust-order-type').value;
            let areaSelect = document.getElementById('cust-area');
            let areaName = areaSelect.options[areaSelect.selectedIndex].text.split(' -')[0];
            let addressDetails = document.getElementById('cust-address').value.trim();
            
            if(!name || !phone) {
                alert("الرجاء إدخال الاسم ورقم الموبايل!");
                return;
            }
            if(orderType === 'دليفري' && (areaSelect.value === "0" || !addressDetails)) {
                alert("الرجاء اختيار المنطقة وكتابة العنوان تفصيلاً!");
                return;
            }

            let orderId = Math.floor(1000 + Math.random() * 9000);

            let message = `👤 العميل: ${name}%0A`;
            message += `📱 الموبايل: ${phone}%0A`;
            message += `🛵 نوع الطلب: ${orderType}%0A`;
            
            if (orderType === 'دليفري') {
                message += `📍 المنطقة: ${areaName}%0A`;
                message += `🏠 العنوان تفصيلاً: ${addressDetails}%0A`;
                message += `🗺️ اللوكيشن (GPS): https://www.google.com/maps?q=30.0799,31.3401%0A`;
            }
            
            message += `_________________________________%0A%0A`;
            message += `📋 جدول الطلبات:%0A`;
            message += `_________________________________%0A%0A`;
            
            cart.forEach(item => {
                message += `🔶 ${item.qty} » ${item.name}%0A`;
            });
            
            message += `_________________________________%0A%0A`;
            message += `✅ رقم الطلب للمتابعة: WA-${orderId}%0A`;

            window.open(`https://wa.me/${restaurantWhatsApp}?text=${message}`, '_blank');
        }

        initMenu();
    </script>
</body>
